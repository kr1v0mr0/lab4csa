[project]
name = "lab4csa"
version = "0.1.0"
description = "Stack ISA lab: translator + microcoded simulator"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "src"
files = ["src/machine.py", "src/translator.py", "src/microcode.py", "src/opcodes.py"]
strict = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["microcode", "machine", "translator", "opcodes"]
implicit_reexport = true
